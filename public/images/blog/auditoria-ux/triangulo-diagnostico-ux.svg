<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" role="img" aria-labelledby="t d"><title id="t">Triángulo técnico del diagnóstico UX</title><desc id="d">Tres métodos que se combinan: evaluación heurística con expertos, test con usuarios y evaluación de accesibilidad con normas y regulaciones.</desc><rect width="800" height="660" fill="#F6F4EB"/><polygon points="400,150 130,520 650,520" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/><text x="400" y="330" font-size="19" fill="#1A1A1A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Web o app accesible</text><text x="400" y="354" font-size="19" fill="#1A1A1A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">y usable para tu</text><text x="400" y="378" font-size="19" fill="#1A1A1A" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">público objetivo</text><circle cx="400" cy="150" r="30" fill="#FFE066" stroke="#1A1A1A" stroke-width="3"/><text x="400" y="158" font-size="24" font-weight="700" text-anchor="middle" fill="#1A1A1A" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">1</text><circle cx="130" cy="520" r="30" fill="#BFE3D0" stroke="#1A1A1A" stroke-width="3"/><text x="130" y="528" font-size="24" font-weight="700" text-anchor="middle" fill="#1A1A1A" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">2</text><circle cx="650" cy="520" r="30" fill="#C9D6F5" stroke="#1A1A1A" stroke-width="3"/><text x="650" y="528" font-size="24" font-weight="700" text-anchor="middle" fill="#1A1A1A" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">3</text><text x="400" y="52" font-size="20" font-weight="700" text-anchor="middle" fill="#1A1A1A" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Evaluación heurística con expertos</text><text x="400" y="80" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Especialistas revisan contra criterios reconocidos</text><text x="130" y="582" font-size="20" font-weight="700" text-anchor="middle" fill="#1A1A1A" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Test con usuarios</text><text x="130" y="606" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Personas reales usan el</text><text x="130" y="624" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">producto y las observamos</text><text x="640" y="582" font-size="20" font-weight="700" text-anchor="middle" fill="#1A1A1A" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Accesibilidad con normas</text><text x="640" y="606" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Revisión contra WCAG y</text><text x="640" y="624" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">regulaciones vigentes</text></svg>