<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t d"><title id="t">Los 4 cuadrantes del conocimiento en UX</title><desc id="d">Lo que sabemos que sabemos, lo que sabemos que desconocemos, lo que desconocemos que sabemos y lo que no sabemos que desconocemos, con una definición y un ejemplo cada uno.</desc><rect width="800" height="620" fill="#F6F4EB"/><rect x="20" y="20" width="370" height="280" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/><rect x="20" y="20" width="370" height="64" rx="14" fill="#BFE3D0" stroke="#1A1A1A" stroke-width="2.5"/><text x="38" y="47" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Lo que sabemos que sabemos</text><text x="38" y="112" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Hechos confirmados con datos o</text><text x="38" y="131" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">investigación previa.</text><text x="38" y="190" font-size="12" font-weight="700" fill="#4A4A44" letter-spacing="1" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">EJEMPLO</text><text x="38" y="212" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">El 60% de nuestros usuarios abandona el</text><text x="38" y="231" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">carrito en el paso de envío.</text><rect x="410" y="20" width="370" height="280" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/><rect x="410" y="20" width="370" height="64" rx="14" fill="#FFE066" stroke="#1A1A1A" stroke-width="2.5"/><text x="428" y="47" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Lo que sabemos que</text><text x="428" y="68" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">desconocemos</text><text x="428" y="112" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Preguntas o hipótesis claras que aún no</text><text x="428" y="131" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">hemos investigado.</text><text x="428" y="190" font-size="12" font-weight="700" fill="#4A4A44" letter-spacing="1" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">EJEMPLO</text><text x="428" y="212" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Sabemos que abandonan en el envío, pero no</text><text x="428" y="231" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">sabemos si es por el costo o por los</text><text x="428" y="250" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">tiempos de entrega.</text><rect x="20" y="320" width="370" height="280" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/><rect x="20" y="320" width="370" height="64" rx="14" fill="#C9D6F5" stroke="#1A1A1A" stroke-width="2.5"/><text x="38" y="347" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Lo que desconocemos que</text><text x="38" y="368" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">sabemos</text><text x="38" y="412" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Conocimiento implícito, intuiciones del</text><text x="38" y="431" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">equipo o datos dispersos que no se han</text><text x="38" y="450" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">conectado.</text><text x="38" y="490" font-size="12" font-weight="700" fill="#4A4A44" letter-spacing="1" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">EJEMPLO</text><text x="38" y="512" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">El equipo de soporte sabe por qué llaman</text><text x="38" y="531" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">los clientes, pero esa información nunca</text><text x="38" y="550" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">llegó a los diseñadores.</text><rect x="410" y="320" width="370" height="280" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/><rect x="410" y="320" width="370" height="64" rx="14" fill="#F5C9C9" stroke="#1A1A1A" stroke-width="2.5"/><text x="428" y="347" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Lo que no sabemos que</text><text x="428" y="368" font-size="17" fill="#1A1A1A" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">desconocemos</text><text x="428" y="412" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Puntos ciegos totales. Comportamientos</text><text x="428" y="431" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">ocultos, usos inesperados o barreras</text><text x="428" y="450" font-size="14" fill="#1A1A1A" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">invisibles.</text><text x="428" y="490" font-size="12" font-weight="700" fill="#4A4A44" letter-spacing="1" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">EJEMPLO</text><text x="428" y="512" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">Descubrir que los usuarios comparten una</text><text x="428" y="531" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">misma cuenta entre toda su familia,</text><text x="428" y="550" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">rompiendo toda la lógica de</text><text x="428" y="569" font-size="14" fill="#4A4A44" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">personalización de la app.</text></svg>