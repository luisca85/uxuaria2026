  <main class="tf-main">
    <section class="tf-thanks" aria-labelledby="thanksTitle">
      <div class="tf-end__icon" aria-hidden="true">✓</div>
      <h1 class="tf-welcome__title" id="thanksTitle">¡Gracias!</h1>

  <script>
  (function () {
    // First name saved by diagnostico.js; kept out of the URL on purpose
    var name = '';
    try {
      name = sessionStorage.getItem('diagnosticoNombre') || '';
      sessionStorage.removeItem('diagnosticoNombre');
    } catch (err) { /* storage blocked: keep the generic title */ }
    if (name) document.getElementById('thanksTitle').textContent = '¡Gracias, ' + name + '!';
  })();
  </script>
